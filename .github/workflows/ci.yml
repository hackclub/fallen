name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    # ubuntu-latest is 26.04 now, which has no prebuilt Ruby for setup-ruby yet.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fallen_test
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1.342.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: platform
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      # Every check lives in config/ci.rb so bin/ci locally and this job stay identical.
      - run: bin/ci
