name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ruby:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fallen_test
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
          working-directory: platform
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Lint (RuboCop)
        run: bin/rubocop -f github
      - name: Security scan (Brakeman)
        run: bin/brakeman --no-pager
      - name: Audit gems
        run: bin/bundler-audit --update
      - name: Tests
        run: bin/rails db:prepare test
      - name: Generated files are current (annotations, TypeScript types, route helpers)
        env:
          TYPELIZER: "1"
        run: |
          bundle exec annotaterb models --frozen --show-migration
          bin/rails typelizer:generate:refresh
          git diff --exit-code -- app/frontend/types app/frontend/routes db/schema.rb

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
      - name: Type check (svelte-check)
        run: npm run check
      - name: Formatting (Prettier)
        run: npm run format:check
      - name: Audit packages
        run: npm audit --omit=dev
