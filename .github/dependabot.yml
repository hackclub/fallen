version: 2
updates:
  - package-ecosystem: bundler
    directory: "/platform"
    schedule:
      interval: weekly
    groups:
      gems:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/platform"
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
