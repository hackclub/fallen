test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Cloudflare R2 (S3 compatible). Used in production when R2_BUCKET is set.
r2:
  service: S3
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  region: auto
  bucket: <%= ENV["R2_BUCKET"] %>
  endpoint: <%= ENV["R2_ENDPOINT"] %>
  force_path_style: true
  # aws-sdk-s3 adds a CRC32 checksum to every upload by default; Active Storage already sends Content-MD5 and R2
  # rejects a request with both ("You can only specify one non-default checksum at a time").
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
