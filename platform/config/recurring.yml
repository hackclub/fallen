# Recurring jobs run by the Solid Queue scheduler (bin/jobs).
# Schedules use fugit syntax: "every hour", "at 5am every day", or cron strings.
production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  clear_solid_cable_messages:
    command: "SolidCable::Message.trimmable.delete_all"
    schedule: every hour at minute 42

  clear_active_insights:
    command: "[ActiveInsights::Request, ActiveInsights::Job].each { it.where(started_at: ...30.days.ago).delete_all }"
    schedule: every day at 4:17am

  # Hourly for the rest of Monday, so a worker restarting at noon doesn't skip the week; settling is once per week.
  close_week:
    class: CloseWeekJob
    queue: background
    schedule: "0 12-23 * * 1"

  settle_lulu_weeks:
    class: SettleLuluWeeksJob
    queue: background
    schedule: every day at 12pm

  sync_users_to_airtable:
    class: SyncUsersToAirtableJob
    queue: background
    schedule: every 5 minutes

  sync_project_transfers:
    class: SyncProjectTransfersJob
    queue: background
    schedule: every 10 minutes

  sync_huddle:
    class: HuddleSyncJob
    queue: realtime
    schedule: every minute

  time_milestones:
    class: TimeMilestoneJob
    queue: slack
    schedule: every minute
