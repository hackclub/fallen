# Recurring jobs run by the Solid Queue scheduler (bin/jobs).
# Schedules use fugit syntax: "every hour", "at 5am every day", or cron strings.
production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  clear_solid_cable_messages:
    command: "SolidCable::Message.trimmable.delete_all"
    schedule: every hour at minute 42

  clear_active_insights:
    command: "[ActiveInsights::Request, ActiveInsights::Job].each { it.where(started_at: ...30.days.ago).delete_all }"
    schedule: every day at 4:17am

  # Hourly for the rest of Monday, so a worker restarting at noon doesn't skip the week; settling is once per week.
  close_week:
    class: CloseWeekJob
    queue: background
    schedule: "0 12-23 * * 1"

  # Hourly, so a bonus lands within the hour a person's week ends at their midnight rather than up to a day later
  # (the card has already reset by then). Paying is once per week.
  settle_lulu_weeks:
    class: SettleLuluWeeksJob
    queue: background
    schedule: every hour at minute 7

  sync_users_to_airtable:
    class: SyncUsersToAirtableJob
    queue: background
    schedule: every 5 minutes

  # Nudges reviewers when journal review falls behind (ProgressQueueNudgeJob).
  nudge_journal_reviewers:
    class: ProgressQueueNudgeJob
    queue: slack
    schedule: every day at 10am

  # HCB's access token, which design funding is sent with (HcbConnection), renewed before it expires.
  refresh_hcb_token:
    class: HcbTokenRefreshJob
    queue: background
    schedule: every 10 minutes

  # Re-reads every card grant in the HCB org and checks it against what Fallen sent (GrantLedger).
  check_hcb_ledger:
    class: GrantLedgerSyncJob
    queue: background
    schedule: every 15 minutes

  sync_project_transfers:
    class: SyncProjectTransfersJob
    queue: background
    schedule: every 10 minutes

  sync_huddle:
    class: HuddleSyncJob
    queue: realtime
    schedule: every minute

  time_milestones:
    class: TimeMilestoneJob
    queue: slack
    schedule: every minute

  # Every 15 minutes so half- and quarter-hour timezones are pinged near the hour too.
  day_end_reminders:
    class: DayEndReminderJob
    queue: slack
    schedule: every 15 minutes
