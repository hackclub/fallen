# Recurring jobs run by the Solid Queue scheduler (bin/jobs).
# Schedules use fugit syntax: "every hour", "at 5am every day", or cron strings.
production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  clear_solid_cable_messages:
    command: "SolidCable::Message.trim"
    schedule: every hour at minute 42

  close_week:
    class: CloseWeekJob
    queue: background
    schedule: "0 12 * * 1"
