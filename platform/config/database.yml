# Single PostgreSQL database for everything: app tables, Solid Queue, Solid Cache and Solid Cable.
# Set DATABASE_URL to override the defaults below (always required in production).
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # No single statement may run longer than this. A page that needs more has a missing index or belongs in a
  # job. Migrations set their own timeouts (config/initializers/strong_migrations.rb).
  variables:
    statement_timeout: <%= ENV.fetch("DB_STATEMENT_TIMEOUT", "5s") %>
    lock_timeout: 5s

development:
  <<: *default
  url: <%= ENV.fetch("DATABASE_URL") { "postgresql://postgres:postgres@localhost:5432/fallen_development" } %>

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL") { ENV["DATABASE_URL"].to_s.sub(/_development\z/, "_test").presence || "postgresql://postgres:postgres@localhost:5432/fallen_test" } %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  # Keep idle connections. Slack traffic comes in bursts minutes apart, and reconnecting after the default
  # 5 minute reap added up to a second to the first job or hint after each quiet spell.
  idle_timeout: 0
